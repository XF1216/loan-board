<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>借款周报看板</title>
<style>
:root {
  --hb-bg:#f5f5f7; --hb-soft-bg:#fbfbfd;
  --hb-surface:rgba(255,255,255,0.82); --hb-surface-strong:rgba(255,255,255,0.94);
  --hb-text:#1d1d1f; --hb-sub:#6e6e73; --hb-mute:#8e8e93;
  --hb-line:rgba(60,60,67,0.12);
  --hb-danger:#ff453a; --hb-ok:#30d158; --hb-warn:#ff9f0a;
  --hb-progress-yellow:#ffc300; --hb-progress-green:#12b981; --hb-progress-blue:#0a84ff;
  --hb-yellow:#ffc300; --hb-yellow-soft:#ffd60a;
  --hb-shadow:0 1px 2px rgba(15,23,42,0.03), 0 14px 34px rgba(15,23,42,0.07);
  --hb-shadow-y:0 1px 2px rgba(255,195,0,0.12), 0 14px 30px rgba(255,214,10,0.16);
  --ink:var(--hb-text);
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body {
  font-family:"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  color:var(--hb-text);
  display:flex; flex-direction:column;
  background:
    radial-gradient(800px 360px at 10% -5%,rgba(255,214,10,0.16),transparent 55%),
    radial-gradient(700px 320px at 95% 0,rgba(10,132,255,0.08),transparent 50%),
    linear-gradient(180deg,var(--hb-soft-bg),var(--hb-bg));
}
.top {
  flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center;
  gap:10px 14px; margin:10px 12px 0; padding:10px 14px;
  background:var(--hb-surface); backdrop-filter:blur(14px);
  border:1px solid var(--hb-line); border-radius:10px; box-shadow:var(--hb-shadow);
  z-index:2;
}
.top h1 {
  margin:0; font-size:1.05rem; font-weight:700; letter-spacing:-.02em;
  display:inline-flex; align-items:center; gap:8px;
}
.top h1::before {
  content:""; width:4px; height:18px; border-radius:2px;
  background:linear-gradient(180deg,var(--hb-yellow-soft),var(--hb-yellow));
}
.tabs {
  display:inline-flex; gap:2px; padding:3px; border-radius:999px;
  background:rgba(255,255,255,0.72); border:1px solid var(--hb-line);
}
.tabs button {
  border:0; background:transparent; color:var(--hb-sub);
  font:inherit; font-weight:650; font-size:.88rem;
  padding:7px 14px; border-radius:999px; cursor:pointer;
  transition:background .15s,color .15s,box-shadow .15s;
}
.tabs button:hover { color:var(--hb-text); background:rgba(255,214,10,0.12); }
.tabs button.active {
  background:var(--hb-surface-strong); color:var(--hb-text);
  box-shadow:0 1px 2px rgba(15,23,42,0.04), inset 0 -2px 0 var(--hb-yellow);
}
.top .meta { margin-left:auto; font-size:.78rem; color:var(--hb-mute); }
.stage {
  flex:1 1 auto; min-height:0; position:relative;
  margin:10px 12px 12px;
  background:var(--hb-surface); backdrop-filter:blur(10px);
  border:1px solid var(--hb-line); border-radius:10px; box-shadow:var(--hb-shadow);
  overflow:hidden;
}
.stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:transparent; }
.stage iframe.is-idle { visibility:hidden; pointer-events:none; z-index:0; }
.stage iframe.is-active { visibility:visible; pointer-events:auto; z-index:1; }
@media (max-width:720px) {
  .tabs { width:100%; overflow:auto; }
  .top .meta { margin-left:0; }
}
</style>
</head>
<body>
<div class="top">
  <h1>借款周报看板</h1>
  <div class="tabs" role="tablist">
    <button type="button" class="active" data-panel="repayment" role="tab">回款进度表</button>
    <button type="button" data-panel="anomaly" role="tab">城市借款异常分析</button>
    <button type="button" data-panel="t7" role="tab">近七天未SD城市汇报</button>
  </div>
  <div class="meta" id="meta">只读展示 · 公网可打开</div>
</div>
<div class="stage">
  <iframe id="f-repayment" class="is-active" title="回款进度表" src="panels/repayment.html"></iframe>
  <iframe id="f-anomaly" class="is-idle" title="异常分析" src="panels/anomaly.html"></iframe>
  <iframe id="f-t7" class="is-idle" title="近七天未SD" src="panels/t7.html"></iframe>
</div>
<script src="js/defaults.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  const frames = {
    repayment: document.getElementById('f-repayment'),
    anomaly: document.getElementById('f-anomaly'),
    t7: document.getElementById('f-t7')
  };
  function show(panel) {
    Object.keys(frames).forEach(k => {
      frames[k].classList.toggle('is-active', k === panel);
      frames[k].classList.toggle('is-idle', k !== panel);
    });
    document.querySelectorAll('.tabs button').forEach(btn => {
      const on = btn.getAttribute('data-panel') === panel;
      btn.classList.toggle('active', on);
    });
    try { history.replaceState(null, '', '#' + panel); } catch (e) {}
  }
  async function refreshMeta() {
    try {
      await LoanBoardStore.ready();
      const meta = LoanBoardStore.readMeta();
      const stamp = meta.updatedAt ? String(meta.updatedAt).replace('T', ' ').slice(0, 16) : '';
      document.getElementById('meta').textContent = stamp
        ? ('数据更新 ' + stamp)
        : '只读展示 · 公网可打开';
    } catch (e) {
      document.getElementById('meta').textContent = '只读展示 · 公网可打开';
    }
  }
  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => show(btn.getAttribute('data-panel')));
  });
  LoanBoardStore.onUpdate(function () { refreshMeta(); });
  const hash = (location.hash || '#repayment').replace('#', '');
  show(['repayment','anomaly','t7'].includes(hash) ? hash : 'repayment');
  refreshMeta();
})();
</script>
</body>
</html>
